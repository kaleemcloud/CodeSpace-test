name: 15-Matrices

on:
  workflow_dispatch:

jobs:
  backwards-compatibility:
    name: ${{ matrix.os }}-${{ matrix.node-version}}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # if we set fail-fast to false, if any stpes fails it will run other following steps
      matrix:
        node-version: [18.x, 20.x, 21.x]
        os:
          - ubuntu-latest
          - windows-latest
        include:
          - os: ubuntu-latest
            node-version: 16.x
          - os: ubuntu-latest
            node-version: 21.x
            tag: experimental
    steps:
      - name: Setup node
        uses: actions/setup-node@v3
        with: 
          node-version: ${{ matrix.node-version}}

      # - name: fail fast test
      #   if: matrix.tag == 'experimental'
      #   run: exit 1

      # - name: perform some test
      #   run: |
      #     echo "Running test on os ${{ matrix.os }} and Nodejs ${{ matrix.node-version}}"
      #     sleep 10

      - name: Upload Test Results
        run: echo "uploading test results"

  include-example:
    name: ${{ matrix.color}}-${{ matrix.shape}}-${{ matrix.size}}-${{ matrix.opacity}}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        color: [Red, green]
        shape: [circle, square]
        size: [small, large]
        include:
          
          - color: Red
            opacity: 75
          - shape: circle
            opacity: 100
          - color: Red
            shape: triangle
          - opacity: 50
          - color: green
            shape: circle
            size: medium

        exclude:
          - color: green
            shape: circle
    steps:
      - name: diagram
        run: echo "${{ matrix.color}}-${{ matrix.shape}}-${{ matrix.size}}--${{ matrix.opacity}}"
